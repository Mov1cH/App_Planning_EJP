<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - Planning EJP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="text-center mb-3">Mot de passe oublié ?</h3>
                    <p class="text-muted text-center mb-4">Entrez votre adresse email pour recevoir un lien de réinitialisation.</p>
                    
                    {% if succes %}
                    <div class="alert alert-success">{{ succes }}</div>
                    {% endif %}
                    
                    <form action="/mot-de-passe-oublie" method="POST">
                        <div class="mb-4">
                            <label for="email" class="form-label fw-bold text-muted small">Adresse Email</label>
                            <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="nom@eglise.com" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary py-2 fw-bold">Envoyer le lien</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <a href="/login" class="text-decoration-none text-muted small">Retour à la connexion</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
