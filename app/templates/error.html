<!DOCTYPE html>
<html lang="fr" style="{{ accent(request) }}">
<head>
  {% include "_head.html" %}
  <title>{{ titre }} · Planning</title>
</head>
<body>
{% include "_icons.html" %}
<main class="auth-main" style="min-height:100dvh">
  <div class="auth-card">
    <p class="page-title" style="color:var(--acc)">{{ code }}</p>
    <h2 style="margin:16px 0 12px">{{ titre }}</h2>
    <p class="muted" style="margin-bottom:28px">
      {% if code == 404 %}Cette page n'existe pas ou a été déplacée.{% else %}La demande n'a pas pu être traitée. Réessayez dans un instant.{% endif %}
    </p>
    <a class="btn btn-dark" href="/">Retour à l'accueil</a>
  </div>
</main>
</body>
</html>
