{% extends "auth_base.html" %}
{% block title %}Nouveau mot de passe{% endblock %}
{% block content %}
<h2>Nouveau mot de passe</h2>
<p class="lead">Choisissez un mot de passe d'au moins 8 caractères.</p>
{% if erreur %}<div class="alert alert-erreur" role="alert">{{ icon('alert') }}<span>{{ erreur }}</span></div>{% endif %}
<form action="/reinitialiser-mot-de-passe" method="post">
  <input type="hidden" name="token" value="{{ token }}">
  <div class="field">
    <label class="label" for="nouveau_mot_de_passe">Nouveau mot de passe</label>
    <div class="pw-wrap">
      <input class="input" type="password" id="nouveau_mot_de_passe" name="nouveau_mot_de_passe" autocomplete="new-password" minlength="8" required autofocus>
      <button type="button" class="icon-btn pw-toggle" data-toggle-password="nouveau_mot_de_passe" aria-label="Afficher le mot de passe" aria-pressed="false">{{ icon('eye') }}</button>
    </div>
  </div>
  <button type="submit" class="btn btn-acc btn-block" data-loading>Enregistrer</button>
</form>
{% endblock %}
