<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialiser le mot de passe - Planning EJP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Nouveau mot de passe</h3>
                    
                    <form action="/reinitialiser-mot-de-passe" method="POST">
                        <input type="hidden" name="token" value="{{ token }}">
                        <div class="mb-4">
                            <label for="nouveau_mot_de_passe" class="form-label fw-bold text-muted small">Nouveau mot de passe sécurisé</label>
                            <input type="password" class="form-control form-control-lg" id="nouveau_mot_de_passe" name="nouveau_mot_de_passe" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-success py-2 fw-bold">Sauvegarder et me connecter</button>
                        </div>
                    </form>
                    
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
