<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier le membre - Planning EJP</title>
    <!-- Intégration de Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body class="bg-light">

<!-- Barre de navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
        <div class="d-flex align-items-center">
            <a class="navbar-brand fw-bold me-2" href="/">Planning EJP</a>
            <span class="badge bg-secondary">Département : Coordination</span>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/membres">Membres</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/indisponibilites">Indisponibilités</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/generateur">Générateur de Planning</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-3">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h3 mb-0 text-gray-800">Modifier le membre</h2>
    </div>

    <div class="row justify-content-center">
        <!-- Formulaire de modification -->
        <div class="col-lg-6 mb-4">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-header bg-white py-3 border-bottom-0">
                    <h6 class="m-0 font-weight-bold text-warning">Modification de {{ membre.nom }} {{ membre.prenom or '' }}</h6>
                </div>
                <div class="card-body">
                    <form action="/membres/{{ membre.id }}/modifier" method="POST">
                        <div class="mb-3">
                            <label for="nom" class="form-label text-muted small fw-bold">Nom</label>
                            <input type="text" class="form-control" id="nom" name="nom" value="{{ membre.nom }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="prenom" class="form-label text-muted small fw-bold">Prénom</label>
                            <input type="text" class="form-control" id="prenom" name="prenom" value="{{ membre.prenom or '' }}">
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold mb-2">Rôles assignés</label>
                            <div class="p-3 border rounded bg-light">
                                {% for role in roles %}
                                <div class="form-check mb-2">
                                    <input class="form-check-input" type="checkbox" name="roles" value="{{ role.id }}" id="role_{{ role.id }}" {% if role in membre.roles %}checked{% endif %}>
                                    <label class="form-check-label" for="role_{{ role.id }}">
                                        {{ role.nom }}
                                    </label>
                                </div>
                                {% endfor %}
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-warning fw-bold">Enregistrer les modifications</button>
                            <a href="/membres" class="btn btn-secondary">Annuler</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Intégration de Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
