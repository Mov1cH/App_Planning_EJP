<div class="chips">
  {% for role in roles %}
  <label class="chip">
    <input type="checkbox" name="{{ nom_champ }}" value="{{ role.id }}" {{ 'checked' if role.id in coches }}>
    <span>{{ icon('check', 'i-sm') }}{{ role.nom }}</span>
  </label>
  {% else %}
  <p class="hint">Aucun rôle pour l'instant. <a class="link" href="/roles">Créer un rôle</a></p>
  {% endfor %}
</div>
