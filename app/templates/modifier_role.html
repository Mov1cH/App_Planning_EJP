{% extends "base.html" %}
{% block title %}{{ role.nom }}{% endblock %}
{% block content %}
<a class="back" href="/roles">{{ icon('arrow-left', 'i-sm') }} Rôles</a>
<div class="page-head"><h1 class="page-title">{{ role.nom }}</h1></div>
<form class="form-narrow" action="/roles/{{ role.id }}/modifier" method="post">
  <div class="field"><label class="label" for="nom">Nom du rôle</label><input class="input" id="nom" name="nom" value="{{ role.nom }}" required></div>
  <div class="row2">
    <div class="field"><label class="label" for="quota">Personnes par culte</label><input class="input" type="number" id="quota" name="quota" value="{{ role.quota }}" min="1" max="50" inputmode="numeric" required></div>
    <div class="field"><label class="label" for="ordre">Position</label><input class="input" type="number" id="ordre" name="ordre" value="{{ role.ordre }}" inputmode="numeric" required><span class="hint">Les plus petits numéros passent en premier.</span></div>
  </div>
  <div class="actions">
    <button class="btn btn-acc" type="submit" data-loading>Enregistrer</button>
    <a class="btn btn-quiet" href="/roles">Annuler</a>
  </div>
</form>
{% endblock %}
