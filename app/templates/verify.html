<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification de l'email - Planning EJP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center mt-5">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h3 class="text-center mb-4">Vérification requise</h3>
                    <p class="text-muted text-center mb-4">Un code à 6 chiffres a été envoyé à l'adresse <strong>{{ email }}</strong>.</p>
                    
                    {% if erreur %}
                    <div class="alert alert-danger">{{ erreur }}</div>
                    {% endif %}
                    
                    <form action="/verifier_email" method="POST">
                        <input type="hidden" name="email" value="{{ email }}">
                        <div class="mb-3">
                            <label for="code" class="form-label fw-bold text-muted small">Code de vérification</label>
                            <input type="text" class="form-control form-control-lg text-center fw-bold" id="code" name="code" placeholder="Ex: 123456" required style="letter-spacing: 5px;">
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary py-2 fw-bold">Vérifier mon compte</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
