<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Planning EJP</title>
    <!-- Intégration de Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold text-dark">Planning EJP</h1>
        <p class="lead text-muted">Sélection du Département</p>
    </div>

    <div class="row justify-content-center">
        <!-- Carte Coordination -->
        <div class="col-md-5 mb-4">
            <div class="card shadow-sm border-0 h-100 text-center py-4">
                <div class="card-body">
                    <h3 class="card-title fw-bold text-primary mb-3">Coordination</h3>
                    <p class="card-text text-muted mb-4">Gérez les membres, les indisponibilités et générez le planning pour la coordination des cultes.</p>
                    <a href="/membres" class="btn btn-primary btn-lg px-5 rounded-pill shadow-sm">Accéder</a>
                </div>
            </div>
        </div>

        <!-- Carte Photo -->
        <div class="col-md-5 mb-4">
            <div class="card shadow-sm border-0 h-100 text-center py-4 bg-white opacity-75">
                <div class="card-body">
                    <h3 class="card-title fw-bold text-secondary mb-3">Photo</h3>
                    <p class="card-text text-muted mb-4">Gestion du planning pour l'équipe Photo et Médias.</p>
                    <div class="d-flex flex-column align-items-center">
                        <button class="btn btn-secondary btn-lg px-5 rounded-pill shadow-sm disabled" aria-disabled="true">Accéder</button>
                        <span class="badge bg-warning text-dark mt-3 px-3 py-2 rounded-pill">Bientôt disponible</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Intégration de Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
